# .github/workflows/weekly-travel-trends.yml
# Runs every Monday at 01:00 UTC = 09:00 AM MYT

name: MY Weekly Travel Trends Report

on:
  schedule:
    - cron: "0 1 * * 1"   # Every Monday 01:00 UTC (9:00 AM MYT)
  workflow_dispatch:        # Allow manual trigger for testing

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run travel trends bot
        run: node index.js
