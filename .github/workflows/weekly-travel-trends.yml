# .github/workflows/weekly-travel-trends.yml
# Runs every Monday at 01:00 UTC = 09:00 AM MYT
name: MY Weekly Travel Trends Report
on:
  schedule:
    - cron: "0 1 * * 1"   # Every Monday 01:00 UTC (9:00 AM MYT) — full report
    - cron: "0 1 * * 3"   # Every Wednesday — keeps repo active, no Lark send
  workflow_dispatch:        # Allow manual trigger for testing
    inputs:
      test_mode:
        description: "Send a test card with sample company data"
        type: boolean
        default: false
permissions:
  contents: write           # Needed to commit data.json back to repo
jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run travel trends bot
        env:
          TABLEAU_SERVER:    ${{ secrets.TABLEAU_SERVER }}
          TABLEAU_SITE:      ${{ secrets.TABLEAU_SITE }}
          TABLEAU_PAT_NAME:  ${{ secrets.TABLEAU_PAT_NAME }}
          TABLEAU_PAT_SECRET: ${{ secrets.TABLEAU_PAT_SECRET }}
          TABLEAU_VIEW_NAME: ${{ secrets.TABLEAU_VIEW_NAME }}
        run: |
          DAY=$(date +%u)
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            echo "Manual test mode — sending test card with sample company data"
            node index.js --test
          elif [ "$DAY" = "1" ]; then
            echo "Monday — running full report + Lark send"
            node index.js
          else
            echo "Non-Monday — keeping repo active, no Lark send"
            node -e "console.log('Repo keepalive ping ✅')"
          fi
      - name: Save data.json to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update data.json [$(date '+%Y-%m-%d')]"
          git push
