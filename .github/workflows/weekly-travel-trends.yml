name: MY Weekly Travel Trends Report
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a test card with sample company data"
        type: boolean
        default: false
      force_run:
        description: "Force a real run now"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run travel trends bot
        env:
          TABLEAU_SERVER: ${{ secrets.TABLEAU_SERVER }}
          TABLEAU_SITE: ${{ secrets.TABLEAU_SITE }}
          TABLEAU_PAT_NAME: ${{ secrets.TABLEAU_PAT_NAME }}
          TABLEAU_PAT_SECRET: ${{ secrets.TABLEAU_PAT_SECRET }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            echo "Manual test mode — sending test card with sample company data"
            node index.js --test
          else
            echo "Sending full report"
            node index.js
          fi
      - name: Save data.json to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update data.json"
          git push
